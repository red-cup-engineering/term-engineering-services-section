name: Receive native term schema package
on:
  pull_request:
    paths:
      - '.github/workflows/term-schema-receiving.yml'
      - 'schemas/glossary/term/**'
      - 'test/term-schema-package-receiving.test.mjs'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/term-schema-receiving.yml'
      - 'schemas/glossary/term/**'
      - 'test/term-schema-package-receiving.test.mjs'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packed-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Syntax-check original typed schema and native consumer
        run: |
          node --check schemas/glossary/term/term.schema.mjs
          node --check test/term-schema-package-receiving.test.mjs
      - name: Pack source and receive the exact artifact in a separate Node consumer
        run: node --test test/term-schema-package-receiving.test.mjs

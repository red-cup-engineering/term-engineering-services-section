name: Receive native term schema package
on:
  pull_request:
    paths:
      - '.github/workflows/term-schema-receiving.yml'
      - 'schemas/glossary/term/**'
      - 'src/term-science-schema.mjs'
      - 'src/term-carrier.mjs'
      - 'scripts/project-term-science-schema.mjs'
      - 'test/section-shape.test.mjs'
      - 'test/term-carrier.test.mjs'
      - 'test/term-schema-package-receiving.test.mjs'
      - 'test/changed-glossary-admission.test.mjs'
      - 'scripts/admit-changed-glossary-paths.mjs'
      - '.github/workflows/changed-glossary-admission.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/term-schema-receiving.yml'
      - 'schemas/glossary/term/**'
      - 'src/term-science-schema.mjs'
      - 'src/term-carrier.mjs'
      - 'scripts/project-term-science-schema.mjs'
      - 'test/section-shape.test.mjs'
      - 'test/term-carrier.test.mjs'
      - 'test/term-schema-package-receiving.test.mjs'
      - 'test/changed-glossary-admission.test.mjs'
      - 'scripts/admit-changed-glossary-paths.mjs'
      - '.github/workflows/changed-glossary-admission.yml'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packed-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Syntax-check original typed schema and native consumer
        run: |
          node --check schemas/glossary/term/term.schema.mjs
          node --check test/term-schema-package-receiving.test.mjs
      - name: Pack source and receive the exact artifact in a separate Node consumer
        run: |
          mkdir -p dist
          TERM_SCHEMA_PACK_OUTPUT_DIR="$GITHUB_WORKSPACE/dist" node --test test/term-schema-package-receiving.test.mjs
          test "$(find dist -maxdepth 1 -name '*.tgz' | wc -l)" = 1
          sha256sum dist/*.tgz
      - name: Retain exact tested candidate for independent downstream receiving
        uses: actions/upload-artifact@v4
        with:
          name: term-schema-candidate-${{ github.sha }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 30
  native-source-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Install original pinned Group dependencies
        run: npm install --no-audit --no-fund --ignore-scripts --fetch-retries=0 --fetch-timeout=30000
      - name: Execute complete original native Term Engineering checks
        run: |
          npm run check
          npm test
